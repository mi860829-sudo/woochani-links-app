<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>우차니 비밀기지</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    #app-content { display: none !important; }
    #login-screen { display: flex; }
    body.logged-in #app-content { display: block !important; }
    body.logged-in #login-screen { display: none !important; }
  </style>
</head>

<body>
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1 class="login-title">우차니 비밀기지</h1>
      <p class="login-desc">로그인 후 이용할 수 있습니다.</p>
      <p id="login-setup" class="login-setup" hidden>
        Vercel 환경 변수(FIREBASE_API_KEY 등 6개)를 설정한 뒤 다시 배포하세요.
      </p>
      <p id="login-error" class="login-error" hidden role="alert"></p>
      <button type="button" id="google-signin" class="google-signin">Google로 로그인</button>
    </div>
  </div>

  <main id="app-content" class="phone">

    <section id="intro" class="page active intro-page">
      <div class="intro-message">
        <p id="type-line"><span class="cursor">▌</span></p>

        <div id="name-box" class="name-box" hidden>
          <input id="pilot-name" maxlength="8" placeholder="이름" />
          <button onclick="savePilot()">등록</button>
        </div>

        <button id="enter-btn" class="enter-btn" onclick="go('home')" hidden>들어가기</button>
      </div>
    </section>

    <section id="home" class="page main-page">
      <div class="mission-panel activity-panel" aria-label="오늘의 활동">
        <button onclick="openActivity('listen')" type="button">
          <span class="mission-icon" aria-hidden="true">🎧</span>
          <strong>흘려듣기</strong>
          <small>소리 · 영상</small>
        </button>

        <button onclick="openActivity('nobuyoung')" type="button">
          <span class="mission-icon" aria-hidden="true">🎬</span>
          <strong>노부영 영상</strong>
          <small>노래 · 이야기</small>
        </button>

        <button onclick="openActivity('books')" type="button">
          <span class="mission-icon" aria-hidden="true">📚</span>
          <strong>책 읽기</strong>
          <small>한글 · 영어</small>
        </button>
      </div>

      <button class="admin-btn" onclick="go('admin-lock')" aria-label="관리실 문 열기">관리실</button>
    </section>

    <section id="activity" class="page mission-page activity-page">
      <button class="back-btn" onclick="go('home')">← 돌아가기</button>

      <div class="study-card activity-card">
        <span id="activity-icon" class="activity-hero-icon" aria-hidden="true">🎧</span>
        <h1 id="activity-title">흘려듣기</h1>
        <p id="activity-description" class="mission-sub">오늘 듣고 싶은 방법을 골라요.</p>
        <div id="activity-options" class="activity-options"></div>
      </div>
    </section>

    <section id="admin-lock" class="page focus-page">
      <button class="back-btn" onclick="go('home')">← 돌아가기</button>
      <h1>관리실</h1>
      <p>관리실 암호를 입력하세요.</p>

      <div class="pass-pad">
        <input id="admin-pass" class="admin-input" type="password" placeholder="암호" readonly />

        <div class="number-pad">
          <button onclick="pressPass('1')">1</button>
          <button onclick="pressPass('2')">2</button>
          <button onclick="pressPass('3')">3</button>
          <button onclick="pressPass('4')">4</button>
          <button onclick="pressPass('5')">5</button>
          <button onclick="pressPass('6')">6</button>
          <button onclick="pressPass('7')">7</button>
          <button onclick="pressPass('8')">8</button>
          <button onclick="pressPass('9')">9</button>
          <button onclick="clearPass()">지움</button>
          <button onclick="pressPass('0')">0</button>
          <button onclick="checkAdmin()">입장</button>
        </div>
      </div>
    </section>

    <section id="admin" class="page focus-page">
      <button class="back-btn" onclick="go('home')">← 돌아가기</button>
      <h1>관리실</h1>

      <p class="admin-welcome">우차니의 하루를 차곡차곡 모아보세요.</p>

      <div class="admin-menu" aria-label="관리실 메뉴">
        <button onclick="openAdminSection('diary')" type="button">
          <span aria-hidden="true">📅</span>
          <strong>일기장</strong>
          <small>하루 이야기</small>
        </button>
        <button onclick="openAdminSection('shelf')" type="button">
          <span aria-hidden="true">📚</span>
          <strong>책장</strong>
          <small>읽은 책 모아보기</small>
        </button>
        <button onclick="openAdminSection('records')" type="button">
          <span aria-hidden="true">🗂️</span>
          <strong>기록</strong>
          <small>활동 흐름 보기</small>
        </button>
        <button onclick="openAdminSection('settings')" type="button">
          <span aria-hidden="true">⚙️</span>
          <strong>설정</strong>
          <small>앱 관리</small>
        </button>
      </div>
    </section>

    <section id="admin-section" class="page focus-page">
      <button class="back-btn" onclick="go('admin')">← 관리실</button>
      <div class="admin-section-head">
        <span id="admin-section-icon" aria-hidden="true">📅</span>
        <h1 id="admin-section-title">일기장</h1>
        <p id="admin-section-description">하루 이야기를 모아보는 공간이에요.</p>
      </div>
      <div class="admin-empty">
        <strong>공간을 준비했어요</strong>
        <p>세부 기록 기능은 다음 단계에서 이곳에 연결할 수 있어요.</p>
      </div>
    </section>

  </main>

  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.example.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
